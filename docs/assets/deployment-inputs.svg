<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Deployment inputs: the system describes, the framework deploys to every target</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .box { stroke: #8c959f; stroke-width: 1.2; }
      .system { fill: #fff8c5; stroke: #d4a72c; }
      .gen { fill: #ddf4ff; stroke: #54aeff; }
      .src { fill: #f6f8fa; }
      .chart { fill: #fbefff; stroke: #c297ff; }
      .out { fill: #dafbe1; stroke: #4ac26b; }
      .title { font-weight: 600; fill: #1f2328; }
      .note { fill: #57606a; font-size: 12px; }
      .edge { stroke: #57606a; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="360" fill="#ffffff"/>

  <text x="20" y="26" class="title">System</text>
  <rect x="20" y="40" width="160" height="70" rx="6" class="box system"/>
  <text x="32" y="64" class="title">infra.yaml</text>
  <text x="32" y="83" class="note">instances, ports,</text>
  <text x="32" y="99" class="note">resource, appEnv</text>
  <rect x="20" y="236" width="160" height="56" rx="6" class="box system"/>
  <text x="32" y="259" class="title">components.yaml</text>
  <text x="32" y="278" class="note">components, scopes</text>

  <text x="220" y="26" class="title">Where instances are (resources-values.yaml)</text>
  <rect x="220" y="40" width="200" height="54" rx="6" class="box gen"/>
  <text x="234" y="62" class="title">Docker target</text>
  <text x="234" y="81" class="note">dev, integration: host ports</text>
  <rect x="220" y="104" width="200" height="54" rx="6" class="box gen"/>
  <text x="234" y="126" class="title">Kubernetes target</text>
  <text x="234" y="145" class="note">kind: Service DNS names</text>
  <rect x="220" y="168" width="200" height="54" rx="6" class="box src"/>
  <text x="234" y="190" class="title">Production platform</text>
  <text x="234" y="209" class="note">managed endpoints, Secrets</text>

  <rect x="470" y="96" width="190" height="122" rx="6" class="box chart"/>
  <text x="484" y="120" class="title">dapr-resources chart</text>
  <text x="484" y="142" class="note">provider templates,</text>
  <text x="484" y="158" class="note">tracing Configuration</text>
  <text x="484" y="186" class="note">+ components.yaml</text>
  <text x="484" y="202" class="note">+ resources-values.yaml</text>

  <rect x="710" y="66" width="170" height="54" rx="6" class="box out"/>
  <text x="724" y="88" class="title">Development</text>
  <text x="724" y="107" class="note">files, scopes kept</text>
  <rect x="710" y="130" width="170" height="54" rx="6" class="box out"/>
  <text x="724" y="152" class="title">Integration tests</text>
  <text x="724" y="171" class="note">files, scopes omitted</text>
  <rect x="710" y="194" width="170" height="54" rx="6" class="box out"/>
  <text x="724" y="216" class="title">kind / production</text>
  <text x="724" y="235" class="note">Helm release</text>

  <path d="M180,67 L220,67" class="edge"/>
  <path d="M180,90 C200,90 200,131 220,131" class="edge"/>
  <path d="M420,67 C450,67 450,124 470,128" class="edge"/>
  <path d="M420,131 L470,150" class="edge"/>
  <path d="M420,195 C445,195 445,172 470,172" class="edge"/>
  <path d="M180,264 C420,264 440,214 470,206" class="edge"/>
  <path d="M660,130 C685,130 685,93 710,93" class="edge"/>
  <path d="M660,157 L710,157" class="edge"/>
  <path d="M660,184 C685,184 685,221 710,221" class="edge"/>

  <text x="20" y="320" class="note">The system describes its infrastructure and components once. The framework runs the instances on each local target</text>
  <text x="20" y="338" class="note">and writes where they are; production provides that file itself. The same chart then renders or installs the components.</text>
</svg>
