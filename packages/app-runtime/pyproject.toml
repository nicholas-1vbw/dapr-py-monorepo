[project]
name = "app-runtime"
version = "0.1.0"
description = "Shared runtime support for apps: settings, logging, tracing, validation, error mapping and Dapr startup checks."
requires-python = ">=3.14"
dependencies = [
    "connectrpc>=0.13.0",
    "connectrpc-otel>=0.3.0",
    "dapr[fastapi]>=1.19.0",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "protovalidate>=2.1.0",
    "pydantic-settings>=2.16.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
