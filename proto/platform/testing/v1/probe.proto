syntax = "proto3";

package platform.testing.v1;

import "buf/validate/validate.proto";

// ProbeService is a contract for the tests of the shared runtime packages
// (packages/app-runtime, gen/python). It is not part of the system and stays
// when the example system is replaced.
service ProbeService {
  // Echo returns the text it receives.
  rpc Echo(EchoRequest) returns (EchoResponse);
  // Split returns each character of the text as a separate message.
  rpc Split(SplitRequest) returns (stream SplitResponse);
  // Join returns the texts it receives, concatenated.
  rpc Join(stream JoinRequest) returns (JoinResponse);
  // Chat answers each message as soon as it arrives.
  rpc Chat(stream ChatRequest) returns (stream ChatResponse);
}

message EchoRequest {
  // Text to echo: 1-64 characters.
  string text = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message EchoResponse {
  string text = 1;
}

message SplitRequest {
  string text = 1;
}

message SplitResponse {
  string text = 1;
}

message JoinRequest {
  string text = 1;
}

message JoinResponse {
  string text = 1;
}

message ChatRequest {
  string text = 1;
}

message ChatResponse {
  string text = 1;
}
