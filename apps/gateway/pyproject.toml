[project]
name = "gateway"
version = "0.1.0"
description = "Gateway app: the public greeting HTTP API, calling the counter app through Dapr."
requires-python = ">=3.14"
dependencies = [
    "app-runtime",
    "greeting",
]

[project.scripts]
gateway = "gateway_app.main:main"

[tool.uv.sources]
app-runtime = { workspace = true }
greeting = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gateway_app"
