# Dapr Components and Configuration of one environment.
#
# Two inputs complete these defaults:
#   - deploy/environment/components.yaml: the components the system uses
#   - a resources-values.yaml: where the infrastructure instances are
#     (generated by local setups, provided by production environments)

# Components, keyed by name. See deploy/environment/components.yaml.
components: {}

configuration:
  name: app-config
  tracing:
    samplingRate: "1"
    # Infrastructure resource of kind `otlp` that receives the sidecars' spans.
    # When the environment does not provide it, sidecars only propagate trace
    # context.
    resource: tracing

# Leave scopes out of rendered components. Only for local integration tests,
# where each test sidecar has a generated app id.
omitScopes: false

# Infrastructure instances, keyed by name, from resources-values.yaml.
resources: {}
