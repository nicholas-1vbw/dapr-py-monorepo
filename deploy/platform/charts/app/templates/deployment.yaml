apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appId }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "app.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: {{ .Values.appId | quote }}
        dapr.io/app-port: {{ .Values.appPort | quote }}
        dapr.io/app-protocol: {{ .Values.appProtocol | quote }}
        {{- with .Values.daprConfig }}
        dapr.io/config: {{ . | quote }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            # The app port is named `http` whatever its protocol (see `expose`).
            - name: http
              containerPort: {{ .Values.appPort }}
          env:
            - name: APP_PORT
              value: {{ .Values.appPort | quote }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          # The app answers probes only after its Dapr startup checks passed:
          # an HTTP app serves /healthz and /readyz from then on, a gRPC app
          # opens its port only then. Keep the startup budget (2s x 60 = 120s)
          # above APP_STARTUP_TIMEOUT_SECONDS (60s by default), so a failing app
          # exits and logs the reason itself before Kubernetes restarts it.
          startupProbe:
            {{- include "app.probe" (list . "/healthz") | nindent 12 }}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            {{- include "app.probe" (list . "/readyz") | nindent 12 }}
            periodSeconds: 5
          livenessProbe:
            {{- include "app.probe" (list . "/healthz") | nindent 12 }}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
