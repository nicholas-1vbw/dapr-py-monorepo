# Deployment input of the `counter-grpc` app instance: the counter service over
# gRPC, reached through Dapr gRPC proxying.
# Read by the framework and used as Helm values of deploy/platform/charts/app.
appId: counter-grpc
member: counter-grpc     # workspace member that provides the app
bakeTarget: counter-grpc # image target in docker-bake.hcl
command: counter-grpc    # console script started by the native launcher
appPort: 8080
appProtocol: grpc        # the app serves gRPC; probes check that its port is open
daprConfig: app-config   # Dapr Configuration (tracing) from deploy/platform/charts/dapr-resources
env:
  APP_STATESTORE_NAME: statestore
