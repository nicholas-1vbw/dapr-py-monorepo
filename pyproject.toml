[project]
name = "dapr-py-monorepo"
version = "0.1.0"
description = "Workspace root: development tooling and task entry points for the Dapr Python monorepo."
requires-python = ">=3.14"
# Every workspace member is installed into the shared development environment.
dependencies = [
    "app-runtime",
    "contracts",
    "counter",
    "gateway",
    "greeting",
]

[dependency-groups]
# Installed first on a fresh clone: generating code must not require the
# generated package to exist yet.
codegen = [
    "poethepoet>=0.49.0",
    "protoc-gen-connectrpc==0.13.0",
    "protoc-gen-py==0.7.0",
]
dev = [
    "httpx2>=2.16.0",
    "packaging>=26.0",
    "pyright>=1.1.414",
    "pytest-asyncio>=1.5.0",
    "pytest-bdd>=9.0.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
]

[tool.uv]
required-version = ">=0.13.7"
package = false
default-groups = ["codegen", "dev"]

[tool.uv.workspace]
members = ["gen/python", "packages/*", "apps/*"]

[tool.uv.sources]
app-runtime = { workspace = true }
contracts = { workspace = true }
counter = { workspace = true }
gateway = { workspace = true }
greeting = { workspace = true }

# ---------------------------------------------------------------------------
# Tasks. Argument parsing and process management live in scripts/*.py; poe
# only forwards arguments.
# ---------------------------------------------------------------------------
[tool.poe.tasks.proto]
help = "Generate Python code from proto/ into gen/python/src"
cmd = "buf generate"
executor = { type = "simple" }

[tool.poe.tasks.setup]
help = "First-time setup: generate code, then install the locked workspace"
sequence = ["proto", { cmd = "uv sync --locked" }]
executor = { type = "simple" }

[tool.poe.tasks.lint]
help = "Static checks: lock file, Buf, Ruff, Pyright and declarative deploy inputs"
sequence = [
    { cmd = "uv lock --check" },
    { cmd = "buf format --diff --exit-code" },
    { cmd = "buf lint" },
    { cmd = "ruff check" },
    { cmd = "ruff format --check" },
    { cmd = "pyright" },
    { cmd = "python -m scripts.tasks.lint_deploy" },
]

[tool.poe.tasks.unit]
help = "Run the unit tests of the workspace members (pytest only, no Dapr)"
cmd = "pytest"

[tool.poe.tasks.framework-tests]
help = "Run the tests of the task engine in scripts/ (uses Helm)"
cmd = "pytest scripts/tests"

[tool.poe.tasks.check]
help = "lint + unit + framework tests"
sequence = ["lint", "unit", "framework-tests"]

[tool.poe.tasks.dev]
help = "Run apps natively with Dapr sidecars and local infrastructure"
cmd = "python -m scripts.tasks.dev"

[tool.poe.tasks.integration]
help = "Run integration tests: one Dapr sidecar per package, shared infrastructure"
cmd = "python -m scripts.tasks.integration"

[tool.poe.tasks.images]
help = "Build images with Docker Bake"
cmd = "python -m scripts.tasks.images"

[tool.poe.tasks.kind]
help = "Manage the local kind environment (up / down)"
cmd = "python -m scripts.tasks.kind"

[tool.poe.tasks.e2e]
help = "Build images, deploy to a fresh kind cluster, run BDD tests, clean up"
cmd = "python -m scripts.tasks.e2e"

[tool.poe.tasks.teardown]
help = "Remove what an interrupted run left behind (--run-id ID)"
cmd = "python -m scripts.tasks.teardown"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# Unit tests of the workspace members only. Framework tests (scripts/tests),
# integration and end-to-end tests run through their own entry points.
testpaths = ["gen", "packages", "apps"]
addopts = ["--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["gen/python/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.pyright]
pythonVersion = "3.14"
include = ["gen/python/tests", "packages", "apps", "scripts", "tests"]
exclude = ["**/__pycache__", ".venv", ".run"]
typeCheckingMode = "standard"
